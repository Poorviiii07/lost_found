<div th:fragment="content">
    <h2>Report Found Item</h2>

    <form th:action="@{/found/add}" th:object="${foundItem}" method="post">
        <div class="form-group">
            <label for="itemName">Item Name:</label>
            <input type="text" th:field="*{itemName}" id="itemName" class="form-control" placeholder="Enter item name" required>
        </div>

        <div class="form-group">
            <label for="description">Description:</label>
            <textarea th:field="*{description}" id="description" class="form-control" placeholder="Enter description" required></textarea>
        </div>

        <div class="form-group">
            <label for="location">Location Found:</label>
            <input type="text" th:field="*{location}" id="location" class="form-control" placeholder="Enter location" required>
        </div>

        <div class="form-group">
            <label for="date">Date Found:</label>
            <input type="date" th:field="*{date}" id="date" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Submit</button>
    </form>
</div>

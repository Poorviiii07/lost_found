<div th:fragment="content">
    <h2 class="mb-4">Found Items</h2>

    <!-- If there are no items -->
    <div th:if="${#lists.isEmpty(foundItems)}">
        <p>No found items to display.</p>
    </div>

    <!-- List of found items -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:if="${!#lists.isEmpty(foundItems)}">
        <div class="col" th:each="item : ${foundItems}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${item.itemName}">Item Name</h5>
                    <p class="card-text" th:text="${item.description}">Description</p>
                    <p class="card-text">
                        <strong>Date:</strong>
                        <span th:text="${#dates.format(item.date,'dd/MM/yyyy')}">Date</span>
                    </p>
                    <p class="card-text">
                        <strong>Location:</strong>
                        <span th:text="${item.location}">Location</span>
                    </p>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/item/{id}(id=${item.id})}" class="btn btn-primary btn-sm w-100">
                        View Details
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
